{{- if .Values.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
  labels:
    app: mongodb
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.persistence.storageClassName }}
  # hostPath aponta para o filesystem do nó minikube (dentro da VM), não do host.
  # Funciona em Linux, macOS e Windows com qualquer driver minikube (docker, qemu2, kvm2).
  # Para mudar o caminho: ajuste persistence.hostPath em values.yaml.
  hostPath:
    path: {{ .Values.persistence.hostPath }}
{{- end }}
